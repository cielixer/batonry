[workspace]
resolver = "3"
members = ["crates/*"]
# One copied crate. It is substituted at the bottom of this file.
exclude = ["crates/winit"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/cielixer/batonry"
rust-version = "1.93"

[workspace.dependencies]
# UI. Declarative (Elm), wgpu backend. Published, like any other dependency:
# only `winit` underneath it is substituted, at the bottom of this file.
iced = { version = "0.14.0", features = [
    "canvas",
    "lazy",
    "advanced",
    "tokio",
] }
iced_core = "0.14.0"
iced_graphics = { version = "0.14.0", default-features = false }
iced_test = "0.14.0"

# VT parsing and the cell grid. Pinned: this crate makes breaking changes
# on minor releases.
alacritty_terminal = "0.26.0"

anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "io-util",
    "process",
    "macros",
    "time",
] }
open = "5.3"
unicode-width = "0.2"

# W3C UI Events key vocabulary. Not a windowing library -- enums and a bitflags
# struct -- so `baton-action` can depend on it without learning what a window
# is. Physical `Code` is the one that matters: it is stable across keyboard
# layouts, and the logical key is not (measured).
keyboard-types = { version = "0.8", default-features = false }

[profile.release]
debug = 1 # keep symbols: we profile release builds

[profile.bench]
debug = 1

# The macOS Korean input fix lives in a copy of winit, because the code it
# patches is the NSView that implements NSTextInputClient and macOS delivers IME
# callbacks there -- no crate without a window can hold it.
#
# **The copy keeps the name `winit` on purpose:** `[patch]` replaces a package
# but cannot rename one.
#
# Measured on cargo 1.93, because only one of the ways to get this wrong is
# dangerous. Renaming the copy, or writing `package = "..."` in the patch
# below, both make cargo refuse outright ("patch for `winit` failed to
# resolve"). **Deleting this section is completely silent** -- no error, no
# warning, and `winit` quietly resolves to crates.io, which builds and drops the
# first Hangul jamo. That is the one `crates/baton-term/tests/ime.rs` exists to
# catch.
[patch.crates-io]
winit = { path = "crates/winit" }
