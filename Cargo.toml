[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/baton-winit", "crates/baton-iced-winit", "crates/baton-iced"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/cielixer/batonry"
rust-version = "1.93"

[workspace.dependencies]
# UI. Declarative (Elm), wgpu backend.
iced = { path = "crates/baton-iced", package = "baton-iced", features = [
    "canvas",
    "lazy",
    "advanced",
    "tokio",
] }
iced_core = "0.14.0"
iced_graphics = { version = "0.14.0", default-features = false }
iced_test = "0.14.0"

# VT parsing and the cell grid. Pinned: this crate makes breaking changes
# on minor releases.
alacritty_terminal = "0.26.0"

anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "io-util",
    "process",
    "macros",
    "time",
] }
open = "5.3"
unicode-width = "0.2"

[profile.release]
debug = 1 # keep symbols: we profile release builds

[profile.bench]
debug = 1
