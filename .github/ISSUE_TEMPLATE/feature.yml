name: Feature request
description: Something Baton should be able to do
labels: ["needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: some things are deliberately left out rather than
        missing. Baton runs no server and holds no credentials, so sync, team
        vaults, session recording, and SSO are permanently out of scope, and
        there is no mobile client because the SSH key would have to live on the
        phone. Windows is not supported - connection reuse is Unix-only by
        construction.

        Everything else is fair game.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the situation, not the feature. "I keep three GPU boxes open
        and lose track of which one is training" tells us more than "add
        labels".
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead
      description: The workaround, another tool, or nothing.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. A shape for it, if you have one.
